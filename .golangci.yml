version: "2"

run:
  timeout: 3m
  build-tags:
    - mock
    - integration

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - decorder
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - copyloopvar
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocyclo
    - gomoddirectives
    - goprintffuncname
    - grouper
    - ineffassign
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - sloglint
    - staticcheck
    - usetesting
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars

  disable:
    - depguard
    - revive
    - funlen
    - goconst
    - testifylint
    - gocritic
    - errcheck
    - maintidx
    - govet
    - gosec
    - gomodguard_v2
    - gosmopolitan
    - interfacebloat
    - loggercheck
    - mirror
    - zerologlint

linters-settings:
  gci:
    sections:
      - standard
      - default
      - blank
      - dot

  gocyclo:
    min-complexity: 15

  nestif:
    min-complexity: 10

  dupl:
    threshold: 160

  funlen:
    lines: 130
    statements: 60

issues:
  exclude-rules:
    - path: ".*_test\\.go$"
      linters:
        - funlen
        - goconst
        - gocyclo

  exclude-use-default: false