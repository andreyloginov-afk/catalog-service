version: "2"

run:
  timeout: 3m
  build-tags:
    - mock
    - integration

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - decorder
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - copyloopvar
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocyclo
    - gomoddirectives
    - goprintffuncname
    - grouper
    - ineffassign
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - protogetter
    - staticcheck
    - usetesting
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars

  disable:
    - depguard
    - revive
    - funlen
    - goconst
    - testifylint
    - gocritic
    - errcheck
    - maintidx
    - govet
    - gosec
    - gosmopolitan
    - interfacebloat
    - loggercheck
    - mirror
    - zerologlint
    - sloglint
    - perfsprint

linters-settings:
  gci:
    sections:
      - standard
      - default
      - blank
      - dot

  gocyclo:
    min-complexity: 15

  nestif:
    min-complexity: 10

  dupl:
    threshold: 160

  funlen:
    lines: 130
    statements: 60

  misspell:
    locale: US

  depguard:
    rules:
      main:
        allow:
          - $gostd
          - $gomodname
          - github.com
        deny:
          - pkg: "emperror.dev/errors"
            desc: should be replaced by "github.com/pkg/errors"

  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(
      - .WithMessage(
      - .WithMessagef(
      - .WithStack(

  errorlint:
    asserts: false

issues:
  exclude-rules:
    - path: ".*_test\\.go$"
      linters:
        - funlen
        - goconst
        - gocyclo

  exclude-use-default: false